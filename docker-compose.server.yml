# Shared-server deployment (low RAM):  docker compose -f docker-compose.server.yml up -d --build
# Differences from docker-compose.yml:
#   - SQL Server's memory is capped (max server memory = 768 MB) so it doesn't starve other apps
#   - the app runs on port 8090 (8080 is taken by nginx) with a 384 MB Java heap
#   - the database port is only reachable from the server itself
#   - containers restart automatically after a crash or reboot
name: trung-library

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Express          # free edition, smallest footprint
    ports:
      - "127.0.0.1:1434:1433"     # not exposed to the internet
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # One-shot: caps SQL Server's memory, creates the database if missing, then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q
        "EXEC sp_configure 'show advanced options', 1; RECONFIGURE;
         EXEC sp_configure 'max server memory (MB)', 768; RECONFIGURE;
         IF DB_ID('LibraryManagement') IS NULL CREATE DATABASE LibraryManagement;"
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlserver://db:1433;databaseName=LibraryManagement;encrypt=true;trustServerCertificate=true
      DB_USERNAME: sa
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_JPA_SHOW_SQL: "false"
      JAVA_TOOL_OPTIONS: "-Xmx384m -XX:MaxMetaspaceSize=128m"
    ports:
      - "8090:8080"

volumes:
  mssql-data:
